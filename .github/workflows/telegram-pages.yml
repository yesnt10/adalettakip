name: Telegram ve harita

on:
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      manual_payload:
        type: string
        default: ''

concurrency:
  group: telegram-pages
  queue: max

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Elle çalıştırma yetkisini doğrula
        if: ${{ github.event_name == 'workflow_dispatch' && (github.actor_id != '114935167' || github.triggering_actor != github.repository_owner) }}
        run: |
          echo 'Bu işlem yalnızca haritanın sahibi tarafından çalıştırılabilir.'
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Telegram'ı kontrol et
        if: ${{ !inputs.manual_payload && github.event_name != 'push' }}
        run: npm run sync
      - name: Manuel sonucu doğrula ve kaydet
        if: inputs.manual_payload
        env:
          MANUAL_PAYLOAD: ${{ inputs.manual_payload }}
        run: node telegram/manual-entry.mjs
      - name: Harita verisi değişti mi?
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ] || ! git diff --quiet -- dist/kayitlar.json; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6.0.0
        if: steps.publish.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.publish.outputs.deploy == 'true'
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Yayın dosyasının GitHub'da görünmesini bekle
        if: steps.publish.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$ARTIFACT_NAME" --jq '.total_count' | grep -qx '1'; then
              exit 0
            fi
            sleep 2
          done
          echo 'Yayın dosyası henüz GitHub tarafından listelenmedi.' >&2
          exit 1
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
        if: steps.publish.outputs.deploy == 'true'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Sonuçları ve kontrol noktasını kaydet
        run: |
          git add -- dist/kayitlar.json telegram/cursor.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${GITHUB_WORKFLOW}" = "Manuel duyuru ekle" ]; then
            git commit -m 'Manuel duyuruyu kaydet'
          else
            git commit -m 'Telegram duyurularını güncelle'
          fi
          git push origin HEAD:main
